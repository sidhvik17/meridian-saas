# Render Blueprint for Meridian — one-click deploy.
#
# Deploy: https://dashboard.render.com/blueprints  ->  connect this repo,
# or click:  https://render.com/deploy?repo=https://github.com/sidhvik17/meridian-saas
#
# Provisions: web (gunicorn) + worker (celery) + managed Postgres + managed
# Redis/Key-Value, and wires every secret automatically. SECRET_KEY is
# generated by Render; DB and Redis credentials are injected from the managed
# services below — nothing sensitive is committed.
#
# NOTE ON MULTI-TENANCY: on the default *.onrender.com host only the PUBLIC
# surface resolves (marketing landing, /admin/, login) because tenant portals
# are matched by exact hostname in the Domain table. To exercise tenant
# subdomains (acme.<domain>) add a custom domain in Render with a wildcard
# CNAME and set DJANGO_ALLOWED_HOSTS / seed tenant domains accordingly.

databases:
  - name: meridian-db
    databaseName: meridian
    user: meridian
    plan: free            # Free Postgres is fine for a demo (expires ~30 days).

services:
  # --- Redis / Key-Value (cache + Celery broker/result) --------------------
  - type: redis
    name: meridian-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []       # internal-only; no public access.

  # --- Web (Django + gunicorn + WhiteNoise static) -------------------------
  - type: web
    name: meridian-web
    runtime: python
    plan: free
    # Free tier has no preDeployCommand; migrate + (idempotent) seed run in build.
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo"
    startCommand: "gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # 256-bit CSPRNG value; satisfies >=50 chars.
      - key: DJANGO_BEHIND_TLS_PROXY
        value: "true"                # Render terminates TLS and sets X-Forwarded-Proto.
      # Render injects the live hostname; bare host is treated as PUBLIC so the
      # landing/login/admin pages resolve without tenant context.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: meridian-web
          property: host
      - key: DJANGO_PUBLIC_HOSTS
        fromService:
          type: web
          name: meridian-web
          property: host
      # CSRF needs the https://<host> form, which can't be built from `host`
      # alone — set this once after the first deploy (see DEPLOY.md).
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # --- Postgres (TLS required in production) ---
      - key: POSTGRES_DB
        fromDatabase: { name: meridian-db, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: meridian-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: meridian-db, property: password }
      - key: POSTGRES_HOST
        fromDatabase: { name: meridian-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: meridian-db, property: port }
      - key: DB_SSLMODE
        value: require
      # --- Redis / Celery ---
      - key: REDIS_URL
        fromService: { type: redis, name: meridian-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: redis, name: meridian-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: redis, name: meridian-redis, property: connectionString }

  # --- Celery worker (async billing tasks) ---------------------------------
  # NOTE: Render background workers require a paid instance type. Set plan to
  # `starter` to enable async billing; the web surface works without it.
  - type: worker
    name: meridian-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements/production.txt"
    startCommand: "celery -A config worker -l info --concurrency 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        fromService: { type: web, name: meridian-web, envVarKey: DJANGO_SECRET_KEY }
      - key: DJANGO_ALLOWED_HOSTS
        fromService: { type: web, name: meridian-web, property: host }
      - key: POSTGRES_DB
        fromDatabase: { name: meridian-db, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: meridian-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: meridian-db, property: password }
      - key: POSTGRES_HOST
        fromDatabase: { name: meridian-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: meridian-db, property: port }
      - key: DB_SSLMODE
        value: require
      - key: REDIS_URL
        fromService: { type: redis, name: meridian-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: redis, name: meridian-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: redis, name: meridian-redis, property: connectionString }
