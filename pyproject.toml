[project]
name = "meridian"
version = "1.0.0"
description = "Multi-tenant B2B SaaS platform (Django 5.2 LTS)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by Django; not held to hand-written style rules.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, S: flake8-bandit (security), DJ: flake8-django
select = ["E", "W", "F", "I", "UP", "B", "S", "DJ"]
ignore = [
    "S101",  # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]  # settings star-imports are idiomatic
"**/tests/*" = ["S105", "S106"]         # test fixtures may use literal passwords

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.bandit]
exclude_dirs = [".venv", "**/migrations"]

[tool.bandit.assert_used]
# Smoke-test scripts and tests use assert as their failure mechanism by design.
skips = ["*_check.py", "*test_*.py", "*tests.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "tests.py"]
